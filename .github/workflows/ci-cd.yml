name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'DatasetProcessingFunction.slnx'
  FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # CI-3b: today's real count (tests/DatasetProcessingFunction.IntegrationTests/). Update this
  # when adding or removing integration tests — it exists to catch a silent drop in how many
  # tests actually ran, not to be a ceiling.
  MIN_INTEGRATION_TESTS: '10'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      - name: Format check
        run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes
      # -warnaserror is explicit, defense-in-depth CI enforcement. The repo's actual warning
      # policy already enforces this at the project level: every .csproj in this solution sets
      # <TreatWarningsAsErrors>true</TreatWarningsAsErrors>, so a plain `dotnet build` already
      # fails on any warning — this flag changes no outcome today, it just makes the CI intent
      # explicit and keeps failing even if a future csproj omits the property.
      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore -warnaserror
      - name: Publish artifact
        run: dotnet publish src/DatasetProcessingFunction/DatasetProcessingFunction.csproj --configuration Release --no-build --output ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: ./publish

  unit-tests:
    name: Unit Tests (≥80% coverage)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run unit tests with coverage
        run: |
          dotnet test tests/DatasetProcessingFunction.UnitTests/ \
            --configuration Release \
            --logger "trx;LogFileName=unit.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      # CI-2: a green "Run unit tests with coverage" step only proves dotnet test exited 0 — it
      # exits 0 just the same if the project failed to build (and `dotnet test` reported that as
      # its own failure instead — see below) or if zero tests were discovered. This is the gap
      # that let PR #36 merge a host project (Program.cs) that didn't compile: the unit-tests job
      # never builds or references that project at all, so nothing here depended on it being
      # correct. This step can't fix *that* (UnitTests.csproj has no ProjectReference to the
      # Functions host — a larger change than this workflow-only task allows), but it closes the
      # adjacent gap: this job must still fail loudly if its own test run finds nothing to execute.
      - name: Fail if zero unit tests executed or any were skipped
        if: always()
        run: |
          TRX=$(find ./TestResults -name 'unit.trx' | head -n1)
          if [ -z "$TRX" ]; then
            echo "::error::No .trx result file found — the test run above did not produce one."
            exit 1
          fi
          # xUnit's trx logger does not reliably populate <Counters notExecuted="...">: a real
          # local repro (one [Fact(Skip=...)]) produced notExecuted="0" in the aggregate summary
          # even though the per-test <UnitTestResult outcome="NotExecuted"> was present and
          # total/executed correctly differed by 1. total - executed is therefore the only count
          # in this file that reliably reflects a skip; per-test outcome="NotExecuted" occurrences
          # are counted too, as a cross-check that must agree.
          COUNTERS=$(grep -o '<Counters[^/]*/>' "$TRX" | head -n1)
          TOTAL=$(echo "$COUNTERS" | grep -oP 'total="\K[0-9]+')
          EXECUTED=$(echo "$COUNTERS" | grep -oP 'executed="\K[0-9]+')
          NOTEXECUTED_RESULTS=$(grep -o 'outcome="NotExecuted"' "$TRX" | wc -l)
          SKIPPED=$((TOTAL - EXECUTED))
          echo "Total: ${TOTAL:-<missing>}, Executed: ${EXECUTED:-<missing>}, Skipped (total-executed): $SKIPPED, NotExecuted result elements: $NOTEXECUTED_RESULTS"
          if [ -z "$EXECUTED" ] || [ "$EXECUTED" -eq 0 ]; then
            echo "::error::Zero unit tests were executed — the test project likely failed to build or discover tests."
            exit 1
          fi
          if [ "$SKIPPED" -gt 0 ] || [ "$NOTEXECUTED_RESULTS" -gt 0 ]; then
            echo "::error::$SKIPPED unit test(s) were skipped (per-test NotExecuted results: $NOTEXECUTED_RESULTS). Every unit test must run on every build — a skip hides a real gap."
            grep -o '<UnitTestResult[^>]*outcome="NotExecuted"[^>]*/>' "$TRX" || true
            exit 1
          fi
      - name: Coverage gate (≥80%)
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coveragereport" \
            -reporttypes:"TextSummary"
          COVERAGE=$(grep "Line coverage" coveragereport/Summary.txt | grep -oP '\d+\.\d+')
          echo "Line coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 80% gate"
            exit 1
          fi

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
    env:
      # Service containers are published to the runner's localhost (no job-level `container:`
      # is set here), so "UseDevelopmentStorage=true" — the Azure SDK's fixed shortcut for
      # http://127.0.0.1:10000/devstoreaccount1 — reaches the azurite service above directly.
      # This is the exact variable name [IntegrationFact] checks (IntegrationFactAttribute.
      # AzuriteConnectionStringVariable): unset, every such test skips instead of running
      # against Azurite; set, they run for real.
      DATA_STORAGE_CONNECTION: UseDevelopmentStorage=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # CI-3: storage-init equivalent (mirrors root docker-compose.yml's storage-init service) —
      # the AzuriteRoundTripTests helper also does CreateIfNotExistsAsync itself, but creating the
      # containers explicitly up front means a missing-container failure shows up here, clearly,
      # rather than inside a test's own setup.
      - name: Create bronze/silver/quarantine containers (storage-init equivalent)
        run: |
          for c in bronze silver quarantine; do
            az storage container create --name "$c" --connection-string "${{ env.DATA_STORAGE_CONNECTION }}" --only-show-errors
          done
      - name: Run integration tests
        run: |
          dotnet test tests/DatasetProcessingFunction.IntegrationTests/ \
            --configuration Release \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory ./TestResults
      - name: Fail if fewer than 10 tests executed, any were skipped, or the Azurite round-trip class was skipped
        if: always()
        run: |
          TRX=$(find ./TestResults -name 'integration.trx' | head -n1)
          if [ -z "$TRX" ]; then
            echo "::error::No .trx result file found — the test run above did not produce one."
            exit 1
          fi
          # xUnit's trx logger does not reliably populate <Counters notExecuted="...">: a real
          # local repro (one [Fact(Skip=...)]) produced notExecuted="0" in the aggregate summary
          # even though the per-test <UnitTestResult outcome="NotExecuted"> was present and
          # total/executed correctly differed by 1. total - executed is therefore the only count
          # in this file that reliably reflects a skip; per-test outcome="NotExecuted" occurrences
          # are counted too, as a cross-check that must agree.
          COUNTERS=$(grep -o '<Counters[^/]*/>' "$TRX" | head -n1)
          TOTAL=$(echo "$COUNTERS" | grep -oP 'total="\K[0-9]+')
          EXECUTED=$(echo "$COUNTERS" | grep -oP 'executed="\K[0-9]+')
          NOTEXECUTED_RESULTS=$(grep -o 'outcome="NotExecuted"' "$TRX" | wc -l)
          SKIPPED=$((TOTAL - EXECUTED))
          # AzuriteRoundTripTests (AGENTS.md §6: "Mocked integration tests do not count as proof")
          # is the one class in this project that proves real Azurite connectivity — a skip there
          # specifically means the live round-trip was never actually exercised this run.
          #
          # <UnitTestResult testName="..."> is the xUnit [Fact(DisplayName=...)] display string, NOT
          # the fully-qualified method name — grepping testName for "AzuriteRoundTripTests" can never
          # match (verified: this class's own DisplayNames are "Azurite round trip: ..."). The real
          # class name lives in <TestDefinitions>'s <UnitTest id="X"><TestMethod className="..."/>,
          # cross-referenced to <UnitTestResult testId="X"> — that's what this resolves instead.
          AZURITE_SKIPPED=$(python3 -c "
          import re, sys
          with open(sys.argv[1]) as f:
              content = f.read()
          azurite_ids = set(re.findall(
              r'<UnitTest[^>]*\bid=\"([0-9a-fA-F-]+)\"[^>]*>.*?<TestMethod[^>]*\bclassName=\"[^\"]*AzuriteRoundTripTests\"',
              content, re.DOTALL))
          names = []
          for tag in re.findall(r'<UnitTestResult\b[^>]*/?>', content):
              idm = re.search(r'\btestId=\"([0-9a-fA-F-]+)\"', tag)
              namem = re.search(r'\btestName=\"([^\"]*)\"', tag)
              if idm and idm.group(1) in azurite_ids and 'outcome=\"NotExecuted\"' in tag:
                  names.append(namem.group(1) if namem else idm.group(1))
          print(len(names))
          for n in names:
              print('  -', n, file=sys.stderr)
          " "$TRX")
          echo "Total: ${TOTAL:-<missing>}, Executed: ${EXECUTED:-<missing>}, Skipped (total-executed): $SKIPPED, NotExecuted result elements: $NOTEXECUTED_RESULTS, AzuriteRoundTripTests skipped: $AZURITE_SKIPPED"
          if [ -z "$EXECUTED" ] || [ "$EXECUTED" -lt "${{ env.MIN_INTEGRATION_TESTS }}" ]; then
            echo "::error::Only ${EXECUTED:-0} integration test(s) executed (need >= ${{ env.MIN_INTEGRATION_TESTS }}) — check that the project built, discovered tests, and that Azurite was reachable."
            exit 1
          fi
          if [ "$AZURITE_SKIPPED" -gt 0 ]; then
            echo "::error::$AZURITE_SKIPPED AzuriteRoundTripTests test(s) were skipped. These must run against the live Azurite service container above, not skip — check that DATA_STORAGE_CONNECTION reached the test process and that azurite is healthy."
            exit 1
          fi
          if [ "$SKIPPED" -gt 0 ] || [ "$NOTEXECUTED_RESULTS" -gt 0 ]; then
            echo "::error::$SKIPPED integration test(s) were skipped (per-test NotExecuted results: $NOTEXECUTED_RESULTS)."
            grep -o '<UnitTestResult[^>]*outcome="NotExecuted"[^>]*/>' "$TRX" || true
            exit 1
          fi

  # CI-3: a single required-status-check target. GitHub branch protection can only require jobs
  # that actually ran on a given workflow run to list as "success" — a job skipped because an
  # upstream `needs` dependency failed does NOT, by itself, block a PR unless that skipped job is
  # ALSO marked required (easy to forget, as PR #36 proved). `gate` collects build/unit-tests/
  # integration-tests with `if: always()` so it runs no matter what upstream did, and fails
  # unless every one of them is exactly "success" — "skipped" is not "success". Mark only `gate`
  # as the required check in branch protection and every upstream failure or skip is covered by
  # construction. Deploy jobs are deliberately not in `needs`: they run after merge to main, on
  # the already-gated commit, not as a merge precondition.
  gate:
    name: Gate
    if: always()
    needs: [build, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require build, unit-tests and integration-tests to have succeeded
        run: |
          echo "build: ${{ needs.build.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "integration-tests: ${{ needs.integration-tests.result }}"
          if [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "::error::gate failed — at least one of build/unit-tests/integration-tests did not report 'success' (skipped counts as not-success)."
            exit 1
          fi

  bicep-what-if:
    name: Bicep What-If
    needs: build
    runs-on: ubuntu-latest
    if: github.event.commits != null && contains(github.event.commits[0].modified, 'infrastructure/')
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Bicep What-If
        run: |
          az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/main.parameters.json

  deploy-staging:
    name: Deploy to Staging Slot
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: function-app
          path: ./publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          slot-name: staging
          package: ./publish
          respect-pom-xml: false

  health-check:
    name: Health Check (Staging)
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Probe staging slot health
        run: |
          URL="https://${{ env.FUNCTION_APP_NAME }}-staging.azurewebsites.net/api/health"
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Health check failed"
          exit 1

  slot-swap:
    name: Slot Swap (Staging → Production)
    needs: health-check
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Swap staging to production
        run: |
          az webapp deployment slot swap \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.FUNCTION_APP_NAME }} \
            --slot staging \
            --target-slot production

  otel-validate:
    name: OTel Validation (non-blocking)
    needs: slot-swap
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Query App Insights for OTEL_SERVICE_NAME traces
        run: |
          az monitor app-insights query \
            --app ${{ env.FUNCTION_APP_NAME }}-ai \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --analytics-query "traces | where customDimensions['OTEL_SERVICE_NAME'] == 'dataset-processing-func' | take 1" \
            --offset 5m || echo "Warning: OTel traces not yet visible (non-blocking)"
