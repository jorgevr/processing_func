version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      azure-sdk:
        patterns:
          - "Azure.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry.*"
          - "Microsoft.Azure.Functions.Worker.OpenTelemetry"
      functions-worker:
        patterns:
          - "Microsoft.Azure.Functions.Worker*"
      test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
          - "coverlet*"
          - "FluentAssertions*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major bumps get their own reviewed task, not a drive-by PR.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Parquet.Net"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"